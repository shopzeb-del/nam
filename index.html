<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEB X VEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0d0b1a;color:#eee;padding:15px}
h1{color:#c77dff;text-align:center;margin:20px 0}
h2{color:#c77dff;text-align:center;margin:30px 0 15px;border-bottom:1px solid #3a2a5a;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;max-width:1000px;margin:0 auto}
.card{background:#1a1533;border:1px solid #3a2a5a;border-radius:10px;padding:15px}
.card h3{color:#c77dff;text-align:center;margin-bottom:10px}
.card ul{list-style:none;margin-bottom:10px}
.card li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2a2040;font-size:14px}
.card li span:last-child{color:#e0aaff;font-weight:bold}
button{width:100%;padding:10px;background:#7b2cbf;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
button:hover{background:#9d4edd}
.box{background:#1a1533;border:1px solid #3a2a5a;border-radius:10px;padding:20px;max-width:400px;margin:20px auto;text-align:center}
.box input,.box select{width:100%;padding:10px;margin:8px 0;background:#0d0b1a;color:#fff;border:1px solid #3a2a5a;border-radius:6px}
.box img{width:200px;max-width:100%;border-radius:8px;background:#fff;padding:4px;margin:10px auto;display:block}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;padding:15px;z-index:99}
.popup .inner{background:#1a1533;border:2px solid #7b2cbf;border-radius:10px;padding:20px;max-width:400px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.popup h3{color:#c77dff;margin-bottom:10px}
.popup .price{color:#ffd166;font-size:20px;font-weight:bold;margin:10px 0}
.popup img{width:200px;max-width:100%;border-radius:8px;background:#fff;padding:4px;margin:10px auto;display:block}
table{width:100%;border-collapse:collapse;max-width:1000px;margin:20px auto;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #3a2a5a;text-align:left}
th{background:#2a2040;color:#c77dff}
.hide{display:none}
.err{color:#e63946;font-size:13px}
.logo-top{display:block;width:90px;height:90px;border-radius:50%;margin:10px auto;border:2px solid #9d4edd;object-fit:cover}
</style>
</head>
<body>

<div id="shop">
<img src="logo.png" class="logo-top" alt="Logo" onerror="this.style.background='#7b2cbf'">
<h1>ZEB X VEX</h1>
<h2>SẢN PHẨM</h2>
<div class="grid" id="products"></div>

<h2>NẠP TIỀN</h2>
<div class="box">
<p><b>ZaloPay:</b> HOÀNG BẢO NAM</p>
<p><b>SĐT:</b> 0355417385</p>
<img src="qr.png" alt="QR" onerror="this.src='https://via.placeholder.com/200/1a1533/c77dff?text=QR'">
<input id="nName" placeholder="Tên của bạn">
<input id="nAmount" type="number" placeholder="Số tiền nạp">
<button onclick="submitNap()">Xác Nhận Đã Chuyển</button>
</div>

<h2>LIÊN HỆ</h2>
<div class="box">
<p>Zalo: <b>0355417385</b></p>
<a href="https://zalo.me/0355417385" target="_blank"><button>Nhắn Zalo</button></a>
</div>

<p style="text-align:center;margin-top:20px"><button style="width:auto;padding:8px 20px" onclick="showLogin()">Đăng nhập Admin</button></p>
</div>

<div id="login" class="hide">
<div class="box" style="margin-top:100px">
<h3 style="color:#c77dff;margin-bottom:10px">🔐 ADMIN</h3>
<input id="pass" type="password" placeholder="Mật khẩu...">
<button onclick="login()">Đăng Nhập</button>
<p id="err" class="err hide">Sai mật khẩu!</p>
<button style="background:#444;margin-top:10px" onclick="backHome()">Quay lại</button>
</div>
</div>

<div id="admin" class="hide">
<h2>QUẢN TRỊ ĐƠN</h2>
<button style="max-width:200px;margin:0 auto 15px;display:block" onclick="logout()">Thoát</button>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Thời gian</th><th>Khách</th><th>Tiền</th><th>Gói</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
<tbody id="orders"></tbody>
</table>
</div>
<p id="empty" style="text-align:center;color:#888">Chưa có đơn.</p>
</div>

<div id="buyPopup" class="popup hide">
<div class="inner">
<h3>MUA HÀNG</h3>
<p id="buyName" style="color:#e0aaff;margin-bottom:10px"></p>
<label style="font-size:13px;color:#c77dff">Chọn gói:</label>
<select id="buyPkg" onchange="pickPkg()">
<option value="">-- Chọn --</option>
</select>
<div id="qrBox" class="hide">
<div class="price" id="buyPrice"></div>
<p style="font-size:13px">Quét QR:</p>
<img src="qr.png" alt="QR" onerror="this.src='https://via.placeholder.com/180/1a1533/c77dff?text=QR'">
<input id="buyCus" placeholder="Tên của bạn">
</div>
<button style="background:#06d6a0;color:#000;margin-top:10px" onclick="doBuy()">Xác Nhận</button>
<button style="background:#e63946;margin-top:8px" onclick="closeBuy()">Hủy</button>
</div>
</div>

<div id="keyPopup" class="popup hide">
<div class="inner">
<h3>CHỌN GÓI KEY</h3>
<p id="keyInfo" style="color:#e0aaff;margin-bottom:10px"></p>
<select id="keyPkg">
<option value="">-- Chọn gói --</option>
<option>Giờ</option><option>Ngày</option><option>Tuần</option>
<option>Tháng</option><option>Năm</option><option>Vĩnh viễn</option>
<option>1 Giờ</option><option>12 Giờ</option><option>1 Ngày</option>
<option>1 Tuần</option><option>1 Tháng</option>
</select>
<button style="background:#06d6a0;color:#000;margin-top:10px" onclick="doApprove()">Duyệt</button>
<button style="background:#e63946;margin-top:8px" onclick="closeKey()">Hủy</button>
</div>
</div>

<script>
var PRODUCTS = [
  {name:'Delta Proxy', pkgs:[{n:'Ngày',p:25000},{n:'Tuần',p:50000},{n:'Tháng',p:130000},{n:'Năm',p:200000}]},
  {name:'Nova X', pkgs:[{n:'Ngày',p:20000},{n:'Tuần',p:50000},{n:'Tháng',p:100000},{n:'Năm',p:160000},{n:'Vĩnh viễn',p:240000}]},
  {name:'Proxy Vip', pkgs:[{n:'Ngày',p:20000},{n:'Tuần',p:50000},{n:'Tháng',p:100000},{n:'Năm',p:170000},{n:'Vĩnh viễn',p:250000}]},
  {name:'Trollmodz', pkgs:[{n:'1 Giờ',p:10000},{n:'12 Giờ',p:25000},{n:'1 Ngày',p:35000},{n:'1 Tuần',p:75000},{n:'1 Tháng',p:150000}]},
  {name:'Proxy Vpn', pkgs:[{n:'Giờ',p:5000},{n:'Ngày',p:20000},{n:'Tuần',p:50000},{n:'Tháng',p:100000},{n:'Năm',p:200000}]}
];

var html='';
PRODUCTS.forEach(function(p,i){
  html+='<div class="card"><h3>'+p.name+'</h3><ul>';
  p.pkgs.forEach(function(k){html+='<li><span>'+k.n+'</span><span>'+k.p.toLocaleString()+'đ</span></li>'});
  html+='</ul><button onclick="openBuy('+i+')">Mua</button></div>';
});
document.getElementById('products').innerHTML=html;

function getOrders(){try{return JSON.parse(localStorage.getItem('zebxvex')||'[]')}catch(e){return[]}}
function saveOrders(o){localStorage.setItem('zebxvex',JSON.stringify(o))}

function submitNap(){
  var n=document.getElementById('nName').value.trim();
  var a=document.getElementById('nAmount').value.trim();
  if(!n||!a){alert('Nhập đủ tên và số tiền!');return}
  var o=getOrders();
  o.push({id:Date.now(),name:n,amount:parseInt(a),time:new Date().toLocaleString('vi-VN'),status:'pending',pkg:''});
  saveOrders(o);
  alert('Đã gửi yêu cầu!');
  document.getElementById('nName').value='';
  document.getElementById('nAmount').value='';
}

var currentProduct=null;
function openBuy(i){
  currentProduct=PRODUCTS[i];
  document.getElementById('buyName').textContent='Sản phẩm: '+currentProduct.name;
  var sel=document.getElementById('buyPkg');
  sel.innerHTML='<option value="">-- Chọn gói --</option>';
  currentProduct.pkgs.forEach(function(k){
    var opt=document.createElement('option');
    opt.value=k.n; opt.setAttribute('data-price',k.p);
    opt.textContent=k.n+' - '+k.p.toLocaleString()+'đ';
    sel.appendChild(opt);
  });
  document.getElementById('qrBox').classList.add('hide');
  document.getElementById('buyCus').value='';
  document.getElementById('buyPopup').classList.remove('hide');
}
function closeBuy(){document.getElementById('buyPopup').classList.add('hide')}
function pickPkg(){
  var sel=document.getElementById('buyPkg');
  var opt=sel.options[sel.selectedIndex];
  var p=opt.getAttribute('data-price');
  if(p){
    document.getElementById('buyPrice').textContent='Tổng: '+parseInt(p).toLocaleString()+'đ';
    document.getElementById('qrBox').classList.remove('hide');
  }else{
    document.getElementById('qrBox').classList.add('hide');
  }
}
function doBuy(){
  var sel=document.getElementById('buyPkg');
  var opt=sel.options[sel.selectedIndex];
  var pkg=opt.value, price=opt.getAttribute('data-price');
  var name=document.getElementById('buyCus').value.trim();
  if(!pkg){alert('Chọn gói!');return}
  if(!name){alert('Nhập tên!');return}
  var o=getOrders();
  o.push({id:Date.now(),name:name+' (Mua '+currentProduct.name+' - '+pkg+')',amount:parseInt(price),time:new Date().toLocaleString('vi-VN'),status:'pending',pkg:pkg});
  saveOrders(o);
  closeBuy();
  alert('Đã tạo đơn! Chờ Admin duyệt.');
}

function showLogin(){
  document.getElementById('shop').classList.add('hide');
  document.getElementById('login').classList.remove('hide');
}
function backHome(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('shop').classList.remove('hide');
}
function login(){
  if(document.getElementById('pass').value==='Nam12'){
    document.getElementById('login').classList.add('hide');
    document.getElementById('admin').classList.remove('hide');
    renderAdmin();
  }else{
    document.getElementById('err').classList.remove('hide');
  }
}
function logout(){
  document.getElementById('admin').classList.add('hide');
  document.getElementById('shop').classList.remove('hide');
  document.getElementById('pass').value='';
  document.getElementById('err').classList.add('hide');
}

function renderAdmin(){
  var o=getOrders();
  var tbody=document.getElementById('orders');
  tbody.innerHTML='';
  if(o.length===0){document.getElementById('empty').style.display='block';return}
  document.getElementById('empty').style.display='none';
  o.sort(function(a,b){return b.id-a.id});
  o.forEach(function(x){
    var tr=document.createElement('tr');
    var st=x.status==='pending'?'<span style="color:#ffd166">Chờ</span>':'<span style="color:#06d6a0">Đã duyệt</span>';
    var btn=x.status==='pending'
      ?'<button style="width:auto;padding:4px 8px;background:#06d6a0;color:#000" onclick="openKey('+x.id+')">Duyệt</button> <button style="width:auto;padding:4px 8px;background:#e63946" onclick="del('+x.id+')">Xóa</button>'
      :'<button style="width:auto;padding:4px 8px;background:#e63946" onclick="del('+x.id+')">Xóa</button>';
    tr.innerHTML='<td>'+x.time+'</td><td>'+x.name+'</td><td>'+x.amount.toLocaleString()+'đ</td><td>'+(x.pkg||'—')+'</td><td>'+st+'</td><td>'+btn+'</td>';
    tbody.appendChild(tr);
  });
}
var curId=null;
function openKey(id){
  curId=id;
  var x=getOrders().find(function(o){return o.id===id});
  if(x) document.getElementById('keyInfo').textContent='Khách: '+x.name+' | '+x.amount.toLocaleString()+'đ';
  document.getElementById('keyPkg').value='';
  document.getElementById('keyPopup').classList.remove('hide');
}
function closeKey(){document.getElementById('keyPopup').classList.add('hide')}
function doApprove(){
  var pkg=document.getElementById('keyPkg').value;
  if(!pkg){alert('Chọn gói!');return}
  var o=getOrders().map(function(x){
    if(x.id===curId){x.status='done';x.pkg=pkg}
    return x;
  });
  saveOrders(o);
  closeKey();
  renderAdmin();
}
function del(id){
  if(!confirm('Xóa đơn?'))return;
  saveOrders(getOrders().filter(function(x){return x.id!==id}));
  renderAdmin();
}
</script>
</body>
</html>
